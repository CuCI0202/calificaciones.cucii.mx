@if (service.show()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/40" (click)="cancel()"></div>
    <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6 animate-scale-in">
      <div class="flex flex-col items-center text-center">
        <div class="w-12 h-12 rounded-full bg-primary-light flex items-center justify-center mb-4">
          <span class="text-primary text-xl font-bold">!</span>
        </div>
        <h2 class="text-lg font-semibold text-brand-dark mb-2">{{ service.title() }}</h2>
        <p class="text-sm text-gray-600 mb-6">{{ service.message() }}</p>
        <div class="flex gap-3 w-full">
          <button
            type="button"
            (click)="cancel()"
            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
            Cancelar
          </button>
          <button
            type="button"
            (click)="confirm()"
            class="flex-1 bg-primary hover:bg-primary-dark text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
}
